AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: fantasy forecaster service

Resources:
  FantasyForecasterModelZip:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: FantasyForecasterModelZip
      Runtime: python3.13
      Architectures:
        - x86_64
      Handler: handler.handler
      CodeUri: model/
      MemorySize: 1536
      Timeout: 120
      Environment:
        Variables:
          DB_READ: "prod"
          DB_WRITE: "prod"
          # Lambda code mounts /var/task read-only; mock writes use /tmp locally.
          MOCK_DB_ROOT: "/tmp/.mock-db"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt FantasyForecasterTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::fantasy-forecaster-data/*"
      Events:
        # Default action: fetch league/player data and run the simulation.
        PurdueUpdateMorning:
          Type: 'Schedule'
          Properties:
            Name: FantasyForecaster-Purdue-Morning
            Schedule: 'cron(0 12 ? * 3-7 *)'  # 6 AM CST (12 PM UTC)
            Enabled: true
            Input: '{"sport": "football-2026", "league": "purdue"}'
        PurdueUpdateAfternoon:
          Type: 'Schedule'
          Properties:
            Name: FantasyForecaster-Purdue-Afternoon
            Schedule: 'cron(0 22 ? * 3-7 *)'  # 4 PM CST (10 PM UTC)
            Enabled: true
            Input: '{"sport": "football-2026", "league": "purdue"}'
        WhaleWatchersUpdate:
          Type: 'Schedule'
          Properties:
            Name: FantasyForecaster-WhaleWatchers-Morning
            Schedule: 'cron(0 12 ? * 3-7 *)'  # 6 AM CST (12 PM UTC)
            Enabled: true
            Input: '{"sport": "football-2026", "league": "whalewatchers"}'

  FantasyForecasterApi:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: FantasyForecasterApi
      Handler: handler.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 5
      CodeUri: api/
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt FantasyForecasterTable.Arn
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /fantasy-forecaster/data
            Method: GET

  FantasyForecasterTable:
    Type: 'AWS::Serverless::SimpleTable'
    Properties:
      TableName: FantasyForecasterTable
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

Outputs:
  ApiGatewayUrl:
    Description: "URL of the API Gateway"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/fantasy-forecaster/data"
